<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equation Solver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #1e293b; /* slate-800 */
            overscroll-behavior: none;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        button, select, input, textarea {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }

        /* Timeline styles */
        .timeline-line {
            position: absolute;
            left: 1.25rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: rgba(99, 102, 241, 0.2); /* indigo-500/20 */
            z-index: 0;
        }
        @media (min-width: 640px) {
            .timeline-line {
                left: 1.5rem;
            }
        }

        /* Term Selection Animation */
        .term-selected {
            border-color: #818cf8 !important; /* indigo-400 */
            background-color: rgba(224, 231, 255, 0.6) !important; /* indigo-100 */
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.2);
            transform: scale(1.02);
        }

        /* Custom Notebook Strikethrough */
        .cancel-strike {
            position: relative;
            display: inline-block;
        }
        .cancel-strike::after {
            content: '';
            position: absolute;
            left: -5%;
            right: -5%;
            top: 50%;
            height: 2px;
            background-color: #f43f5e; /* rose-500 */
            transform: translateY(-50%) rotate(-8deg); /* Slanted notebook cross-out */
            border-radius: 2px;
            opacity: 0.8;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        /* Hide scrollbar for horizontally scrolling math containers */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col items-center p-2 sm:p-4 overflow-y-auto overflow-x-hidden selection:bg-indigo-200 selection:text-indigo-900">

    <!-- Custom Modal Overlay -->
    <div id="custom-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-all duration-300 border border-slate-200" id="custom-modal-box">
            <div class="bg-indigo-50/50 px-6 py-4 border-b border-slate-100 flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-500 shrink-0 shadow-sm border border-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                    </svg>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">Notice</h3>
            </div>
            <div class="p-6">
                <p id="modal-message" class="text-slate-600 text-sm md:text-base leading-relaxed"></p>
            </div>
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 flex justify-end">
                <button onclick="closeModal()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md shadow-indigo-500/20 active:translate-y-0.5">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- Decorative Background Orbs -->
    <div class="fixed inset-0 z-0 flex justify-center items-center overflow-hidden pointer-events-none">
        <div class="absolute w-[800px] h-[800px] bg-indigo-200/40 rounded-full blur-[120px] -top-40 -left-40"></div>
        <div class="absolute w-[600px] h-[600px] bg-teal-200/40 rounded-full blur-[100px] bottom-10 right-0"></div>
    </div>

    <main class="relative z-10 w-full max-w-5xl flex flex-col flex-1 shrink-0 gap-3 sm:gap-4">
        
        <!-- ================= SETUP VIEW ================= -->
        <div id="view-setup" class="glass rounded-3xl p-6 sm:p-8 text-center w-full max-w-2xl mx-auto my-auto transition-all">
            
            <!-- GeniusHub Branding Title -->
            <div class="mb-6 text-center">
                <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-teal-500 tracking-tight pb-1">GeniusHub</h1>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-xs mt-1">Equation Solver</p>
            </div>

            <div class="bg-slate-50/50 p-4 sm:p-6 rounded-2xl border border-slate-200/50 relative text-left">
                <label class="block text-base sm:text-lg font-bold text-slate-700 tracking-tight mb-4 text-center">Build your equation:</label>
                
                <!-- Visual Equation Builder -->
                <div class="bg-white border-2 border-slate-200 rounded-xl p-4 sm:p-6 shadow-sm focus-within:border-indigo-400 focus-within:ring-4 focus-within:ring-indigo-400/10 transition-all flex items-center justify-center gap-2 sm:gap-4 relative mb-6">
                    
                    <!-- LHS Container -->
                    <div class="flex-1 flex flex-col items-center justify-center relative min-h-[4rem]">
                        <input type="text" id="lhs-top" value="3x - 2" class="w-full text-center font-mono text-xl sm:text-2xl text-slate-800 bg-transparent outline-none placeholder-slate-300" placeholder="LHS (e.g. 3x)">
                        <div id="lhs-divider" class="w-full h-[2px] sm:h-[3px] bg-slate-800 my-1 rounded-full"></div>
                        <input type="text" id="lhs-bottom" value="x + 2" class="w-full text-center font-mono text-xl sm:text-2xl text-slate-800 bg-transparent outline-none placeholder-slate-300" placeholder="Denominator">
                        <button id="lhs-toggle" onclick="toggleFraction('lhs')" class="absolute -bottom-8 sm:-bottom-10 text-[9px] sm:text-[10px] text-indigo-500 font-bold uppercase tracking-widest hover:text-indigo-700 transition-colors bg-slate-50 px-2 py-1 rounded border border-slate-200 shadow-sm whitespace-nowrap z-10">Remove Fraction</button>
                    </div>

                    <!-- Equals Sign -->
                    <div class="text-3xl sm:text-4xl font-black text-slate-400 shrink-0 px-1 sm:px-2">=</div>

                    <!-- RHS Container -->
                    <div class="flex-1 flex flex-col items-center justify-center relative min-h-[4rem]">
                        <input type="text" id="rhs-top" value="5" class="w-full text-center font-mono text-xl sm:text-2xl text-slate-800 bg-transparent outline-none placeholder-slate-300" placeholder="RHS (e.g. 5)">
                        <div id="rhs-divider" class="w-full h-[2px] sm:h-[3px] bg-slate-800 my-1 rounded-full hidden"></div>
                        <input type="text" id="rhs-bottom" value="" class="w-full text-center font-mono text-xl sm:text-2xl text-slate-800 bg-transparent outline-none placeholder-slate-300 hidden" placeholder="Denominator">
                        <button id="rhs-toggle" onclick="toggleFraction('rhs')" class="absolute -bottom-8 sm:-bottom-10 text-[9px] sm:text-[10px] text-indigo-500 font-bold uppercase tracking-widest hover:text-indigo-700 transition-colors bg-slate-50 px-2 py-1 rounded border border-slate-200 shadow-sm whitespace-nowrap z-10">Add Fraction</button>

                </div>

                <p class="text-[10px] sm:text-xs text-slate-500 mt-8 text-center">Use the "Add Fraction" buttons to stack terms visually instead of using slashes.</p>
                
                <button onclick="parseAndStart()" class="w-full mt-4 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 sm:py-4 rounded-xl shadow-md shadow-indigo-500/20 transition-all text-lg sm:text-xl transform hover:-translate-y-0.5 active:translate-y-0">

                <p class="text-slate-500 font-bold text-[10px] sm:text-xs uppercase tracking-widest mb-1 sm:mb-2 bg-slate-100/50 px-3 py-1 rounded-full border border-slate-200/50 backdrop-blur-sm z-20">Equation Balance</p>

                        <!-- Center Pole -->

                            <div class="w-3 h-3 rounded-full bg-slate-400 shadow-inner border border-slate-500"></div>

                        <!-- Pivot point -->

                        <!-- LHS Pan -->

                            <!-- Strings connecting to beam -->

                                <line x1="50" y1="0" x2="5" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="50" y1="0" x2="95" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            
                            <div class="w-full bg-white/95 backdrop-blur-md rounded-xl sm:rounded-2xl border-x border-t border-slate-200 border-b-8 sm:border-b-[10px] border-b-slate-300 shadow-[0_10px_20px_-5px_rgba(0,0,0,0.1)] flex flex-col items-center relative md:-mt-1 transition-transform duration-300 group-hover:translate-y-0 md:group-hover:-translate-y-1">

                            <!-- Strings connecting to beam -->

                                <line x1="50" y1="0" x2="5" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="50" y1="0" x2="95" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

                            <div class="w-full bg-white/95 backdrop-blur-md rounded-xl sm:rounded-2xl border-x border-t border-slate-200 border-b-8 sm:border-b-[10px] border-b-slate-300 shadow-[0_10px_20px_-5px_rgba(0,0,0,0.1)] flex flex-col items-center relative md:-mt-1 transition-transform duration-300 group-hover:translate-y-0 md:group-hover:-translate-y-1">
                                <div class="absolute -top-3 sm:-top-4 bg-teal-50 text-teal-700 font-black text-[10px] sm:text-xs uppercase tracking-widest px-4 sm:px-5 py-1 rounded-full shadow-sm border border-teal-200 z-10">RHS</div>

                <p class="text-slate-500 font-bold text-xs sm:text-sm uppercase tracking-wider border-b border-slate-100 pb-1">Choose an Action</p>
                
                <div class="flex flex-col lg:flex-row gap-3 sm:gap-4 items-stretch lg:items-center justify-between">
                    
                    <!-- Direct Term Actions -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 flex-1">
                        <button id="btn-move" onclick="executeMove()" disabled class="w-full bg-indigo-500 disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 disabled:border disabled:cursor-not-allowed hover:bg-indigo-600 text-white font-bold py-2.5 sm:py-3 px-2 sm:px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>

                        <button onclick="executeExpand()" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-900 font-bold py-2.5 sm:py-3 px-2 sm:px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                            <span class="truncate">Expand</span>

                    </div>

                    <div class="hidden lg:block w-px h-12 bg-slate-200"></div>

                    <!-- Whole Equation Operations -->
                    <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center bg-slate-50 p-2 rounded-xl border border-slate-200 justify-center">
                        <div class="flex gap-2">
                            <select id="op-select" class="flex-1 sm:flex-none bg-white border border-slate-300 text-slate-700 font-bold rounded-lg px-2 sm:px-3 py-1.5 sm:py-2 text-sm sm:text-base focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/20 shadow-sm">
                                <option value="+">Add (+)</option>
                                <option value="-">Subtract (-)</option>
                                <option value="*">Multiply (×)</option>
                                <option value="/">Divide (÷)</option>
                            </select>
                            <input type="text" id="op-val" placeholder="Num or expr" class="w-24 sm:w-32 bg-white border border-slate-300 text-slate-800 font-mono font-bold rounded-lg px-2 sm:px-3 py-1.5 sm:py-2 text-sm sm:text-base focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/20 text-center shadow-sm" value="x + 2">
                        </div>
                        <button onclick="executeOperation()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 sm:py-2 px-4 rounded-lg transition-colors shadow-sm text-sm sm:text-base">
                            Apply
                        </button>
                    </div>

                </div>
            </div>

            <!-- Success Banner -->
            <div id="success-banner" class="hidden glass bg-emerald-50/80 border-2 border-emerald-400 p-4 sm:p-6 rounded-2xl text-center shadow-[0_4px_20px_rgba(52,211,153,0.3)] animate-pulse shrink-0">
                <h3 class="text-xl sm:text-2xl font-black text-emerald-600 mb-1">Equation Solved!</h3>
                <p class="text-emerald-700 text-sm sm:text-base">Great job applying the correct operations.</p>
            </div>

            <!-- Step-by-Step History Timeline -->
            <div class="glass rounded-3xl p-4 sm:p-5 shadow-sm relative flex flex-col min-h-[300px] shrink-0 mt-2 mb-4">
                <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-2 sm:mb-3 border-b border-slate-200 pb-2 shrink-0">Step-by-Step Working</h3>
                <div id="history-scroll-container" class="relative flex-1 overflow-y-auto no-scrollbar pl-2 pr-2">
                    <div class="timeline-line"></div>
                    <div id="history-container" class="space-y-4 sm:space-y-6 relative z-10 pb-4">
                        <!-- History injected here -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- Math Helpers (Fraction Engine) ---
        const Frac = {
            create: (n, d = 1) => {
                if (d === 0) return {n:0, d:1};
                let sign = (n < 0) !== (d < 0) ? -1 : 1;
                n = Math.abs(n);
                d = Math.abs(d);
                let g = Frac.gcd(n, d);
                return { n: sign * (n / g), d: d / g };
            },
            gcd: (a, b) => b === 0 ? a : Frac.gcd(b, a % b),
            add: (a, b) => Frac.create(a.n * b.d + b.n * a.d, a.d * b.d),
            sub: (a, b) => Frac.create(a.n * b.d - b.n * a.d, a.d * b.d),
            mul: (a, b) => Frac.create(a.n * b.n, a.d * b.d),
            div: (a, b) => Frac.create(a.n * b.d, a.d * b.n),
            parse: (str) => {
                str = str.replace(/[\s$₹£€,]/g, ''); 
                if (!str || str === '+' || str === '-') return Frac.create(str === '-' ? -1 : 1, 1);
                if (str.includes('/')) {
                    let parts = str.split('/');
                    let n = parseFloat(parts[0]), d = parseFloat(parts[1]);
                    if (isNaN(n) || isNaN(d)) return null;
                    return Frac.create(n, d);
                }
                if (str.includes('.')) {
                    let decParts = str.split('.');
                    let d = Math.pow(10, decParts[1].length);
                    let n = parseInt(str.replace('.', ''), 10);
                    if (isNaN(n)) return null;
                    return Frac.create(n, d);
                }
                let val = parseFloat(str);
                return isNaN(val) ? null : Frac.create(val, 1);
            },
            abs: (f) => ({ n: Math.abs(f.n), d: f.d }),
            toHTML: (f) => {
                let absF = Frac.abs(f);
                let sign = f.n < 0 ? "−" : "";
                if (absF.d === 1) return sign + absF.n;
                return `${sign}<div class="inline-flex flex-col items-center justify-center align-middle mx-[2px] text-[0.75em] leading-none font-bold">
                            <span class="border-b-[1.5px] border-current px-1 pb-[2px]">${absF.n}</span>
                            <span class="pt-[2px]">${absF.d}</span>
                        </div>`;
            }
        };

        // --- Application State ---
        let state = {
            lhs: [], 
            rhs: [],
            originalLhs: [],
            originalRhs: [],
            originalEquationStr: "",
            history: [],
            selectedTermIds: [],
            stepCounter: 0
        };

        // Fraction Builder State
        let isLhsFraction = true;
        let isRhsFraction = false;

        // --- DOM Elements ---
        const views = {
            setup: document.getElementById('view-setup'),
            workspace: document.getElementById('view-workspace')
        };
        const ui = {
            error: document.getElementById('setup-error'),
            lhsZone: document.getElementById('lhs-zone'),
            rhsZone: document.getElementById('rhs-zone'),
            btnMove: document.getElementById('btn-move'),
            btnUndo: document.getElementById('btn-undo'),
            historyContainer: document.getElementById('history-container'),
            opSelect: document.getElementById('op-select'),
            opVal: document.getElementById('op-val'),
            successBanner: document.getElementById('success-banner')
        };

        // --- View Management ---
        function switchView(viewName) {
            Object.values(views).forEach(v => {
                v.classList.add('hidden');
                v.classList.remove('flex');
            });
            if (viewName === 'workspace') {
                views[viewName].classList.remove('hidden');
                views[viewName].classList.add('flex');
            } else {
                views[viewName].classList.remove('hidden');
            }
        }

        function showSetup() { 
            switchView('setup'); 
        }

        // --- Visual Equation Builder Logic ---
        function toggleFraction(side) {
            if (side === 'lhs') {
                isLhsFraction = !isLhsFraction;
                document.getElementById('lhs-divider').classList.toggle('hidden', !isLhsFraction);
                document.getElementById('lhs-bottom').classList.toggle('hidden', !isLhsFraction);
                document.getElementById('lhs-toggle').innerText = isLhsFraction ? "Remove Fraction" : "Add Fraction";
                if (!isLhsFraction) document.getElementById('lhs-bottom').value = ""; 
            } else {
                isRhsFraction = !isRhsFraction;
                document.getElementById('rhs-divider').classList.toggle('hidden', !isRhsFraction);
                document.getElementById('rhs-bottom').classList.toggle('hidden', !isRhsFraction);
                document.getElementById('rhs-toggle').innerText = isRhsFraction ? "Remove Fraction" : "Add Fraction";
                if (!isRhsFraction) document.getElementById('rhs-bottom').value = "";
            }
        }

        // --- Custom Modal Logic ---
        function showModal(title, msg) {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('custom-modal-box');
            document.getElementById('modal-title').textContent = title || "Notice";
            document.getElementById('modal-message').textContent = msg;
            
            modal.classList.remove('hidden');
            
            // Trigger animation
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            });
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('custom-modal-box');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- Core Parsing Logic ---
        function generateId() { return 'term_' + Math.random().toString(36).substr(2, 9); }

        function splitTerms(str) {
            let terms = [];
            let currentTerm = "";
            let depth = 0;
            str = str.replace(/\s+/g, '');
            if (str[0] !== '+' && str[0] !== '-') str = '+' + str;
            
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                if (char === '(') depth++;
                else if (char === ')') depth--;
                
                if ((char === '+' || char === '-') && depth === 0 && i !== 0) {
                    terms.push(currentTerm);
                    currentTerm = char;
                } else {
                    currentTerm += char;
                }
            }
            if (currentTerm) terms.push(currentTerm);
            return terms;
        }

        function parseNormalTerm(str) {
            let match = str.match(/^([+-]?.*?)([a-zA-Z]*)$/);
            if (!match) return null;
            let coeffStr = match[1].trim();
            let varStr = match[2] || null;
            let parsed = Frac.parse(coeffStr);
            if (parsed) return { id: generateId(), type: 'normal', coeff: parsed, var: varStr };
            return null;
        }

        function parseTerm(str) {
            str = str.trim();
            // Allows parsing e.g., (3x-2)/(x+2)
            let groupMatch = str.match(/^([+-]?)([\d./]*)\((.*?)\)(?:\/([\d.]+))?(?:\/\((.*?)\))?$/);
            if (groupMatch) {
                let signStr = groupMatch[1];
                let multStr = groupMatch[2];
                let innerStr = groupMatch[3];
                let divStr = groupMatch[4];
                let divExprStr = groupMatch[5];

                let mult = Frac.parse(multStr || '1');
                if (signStr === '-') mult = Frac.mul(mult, Frac.create(-1));
                
                let factor = mult;
                if (divStr) {
                    let div = Frac.parse(divStr || '1');
                    factor = Frac.div(mult, div);
                }

                let innerTermStrs = splitTerms(innerStr);
                let innerTerms = innerTermStrs.map(t => parseNormalTerm(t)).filter(t => t !== null);
                
                let bottomTerms = null;
                if (divExprStr) {
                    let bottomTermStrs = splitTerms(divExprStr);
                    bottomTerms = bottomTermStrs.map(t => parseNormalTerm(t)).filter(t => t !== null);
                }

                return { id: generateId(), type: 'group', factor: factor, innerTerms: innerTerms, bottomTerms: bottomTerms };
            }
            return parseNormalTerm(str);
        }

        function parseSide(str) {
            if (!str) return [];
            let termStrs = splitTerms(str);
            let terms = [];
            termStrs.forEach(tStr => {
                let t = parseTerm(tStr);
                if (t) terms.push(t);
            });
            return terms;
        }

        function parseAndStart() {
            ui.error.classList.add('hidden');
            
            let lTop = document.getElementById('lhs-top').value.trim();
            let lBot = document.getElementById('lhs-bottom').value.trim();
            let rTop = document.getElementById('rhs-top').value.trim();
            let rBot = document.getElementById('rhs-bottom').value.trim();

            if (!lTop || !rTop) {
                ui.error.textContent = "Please fill in both the Left and Right sides of the equation.";
                ui.error.classList.remove('hidden');
                return;
            }

            if (isLhsFraction && !lBot) {
                ui.error.textContent = "Please fill in the LHS denominator, or remove the fraction.";
                ui.error.classList.remove('hidden');
                return;
            }

            if (isRhsFraction && !rBot) {
                ui.error.textContent = "Please fill in the RHS denominator, or remove the fraction.";
                ui.error.classList.remove('hidden');
                return;
            }

            let rawLhs = isLhsFraction ? `(${lTop})/(${lBot})` : lTop;
            let rawRhs = isRhsFraction ? `(${rTop})/(${rBot})` : rTop;

            let rawEq = `${rawLhs}=${rawRhs}`.replace(/--/g, '+').replace(/\+-/g, '-');
            const parts = rawEq.split('=');
            
            if (parts.length !== 2 || parts[0] === "" || parts[1] === "") {
                ui.error.textContent = "Invalid equation structure.";
                ui.error.classList.remove('hidden');
                return;
            }

            state.lhs = parseSide(parts[0]);
            state.rhs = parseSide(parts[1]);
            state.originalLhs = JSON.parse(JSON.stringify(state.lhs));
            state.originalRhs = JSON.parse(JSON.stringify(state.rhs));
            state.history = [];
            state.stepCounter = 0;
            state.selectedTermIds = [];

            state.originalEquationStr = formatEquation();
            document.getElementById('workspace-title').innerHTML = state.originalEquationStr;

            addHistoryRecord("Original Equation");
            switchView('workspace');
            updateUI();
        }

        // --- Helper for Expression Comparison ---
        function compareTerms(arr1, arr2) {
            if (!arr1 || !arr2 || arr1.length !== arr2.length) return false;
            let a1 = arr1.map(t => `${t.coeff.n}/${t.coeff.d}${t.var||''}`).sort();
            let a2 = arr2.map(t => `${t.coeff.n}/${t.coeff.d}${t.var||''}`).sort();
            for(let i=0; i<a1.length; i++) {
                if(a1[i] !== a2[i]) return false;
            }
            return true;
        }

        // --- Formatting & Text Generation ---
        function formatTermPlain(term, isFirst) {
            if (term.type === 'normal') {
                let isNeg = term.coeff.n < 0;
                let signStr = isNeg ? (isFirst ? '−' : ' − ') : (isFirst ? '' : ' + ');
                let absF = Frac.abs(term.coeff);
                let showCoeff = !(absF.n === 1 && absF.d === 1 && term.var);
                let valHTML = "";
                
                if (showCoeff) {
                    if (absF.d === 1) valHTML += absF.n;
                    else valHTML += `<div class="inline-flex flex-col items-center justify-center align-middle mx-[2px] text-[0.75em] leading-none"><span class="border-b-[1.5px] border-current px-1 pb-[2px]">${absF.n}</span><span class="pt-[2px]">${absF.d}</span></div>`;
                }
                if (term.var) valHTML += `<span class="ml-px">${term.var}</span>`;
                if (absF.n === 0 && !term.var) { signStr = ""; valHTML = "0"; }
                
                return signStr + valHTML;
            } else if (term.type === 'group') {
                let isNeg = term.factor.n < 0;
                let signStr = isNeg ? (isFirst ? '−' : ' − ') : (isFirst ? '' : ' + ');
                let absF = Frac.abs(term.factor);
                let innerHTML = term.innerTerms.map((t, i) => formatTermPlain(t, i === 0)).join('');
                
                let valHTML = "";
                if (term.bottomTerms) {
                    let bottomHTML = term.bottomTerms.map((t, i) => formatTermPlain(t, i === 0)).join('');
                    let multStr = absF.n !== 1 ? absF.n : '';
                    valHTML = `<div class="inline-flex flex-col items-center justify-center align-middle mx-1">
                                    <span class="border-b-[1.5px] border-current px-2 pb-[2px]">${multStr}(${innerHTML})</span>
                                    <span class="pt-[2px]">(${bottomHTML})</span>
                               </div>`;
                } else if (absF.d === 1) {
                    let multStr = absF.n !== 1 ? absF.n : '';
                    valHTML = `${multStr}(${innerHTML})`;
                } else {
                    let multStr = absF.n !== 1 ? absF.n : '';
                    valHTML = `<div class="inline-flex flex-col items-center justify-center align-middle mx-1">
                                    <span class="border-b-[1.5px] border-current px-2 pb-[2px]">${multStr}(${innerHTML})</span>
                                    <span class="pt-[2px]">${absF.d}</span>
                               </div>`;
                }
                return signStr + valHTML;
            }
        }

        function formatSide(sideArray) {
            if (sideArray.length === 0) return "0";
            return sideArray.map((t, i) => formatTermPlain(t, i === 0)).join("");
        }

        function formatEquation() {
            return `${formatSide(state.lhs)} <span class="mx-3 text-indigo-500">=</span> ${formatSide(state.rhs)}`;
        }

        function formatSideWithStrikethrough(sideArray, idsToStrike) {
            if (sideArray.length === 0) return "0";
            return sideArray.map((t, i) => {
                let termHTML = formatTermPlain(t, i === 0);
                if (idsToStrike.includes(t.id)) {
                    return `<span class="cancel-strike text-slate-400 opacity-60">${termHTML}</span>`;
                }
                return termHTML;
            }).join("");
        }

        function formatEquationWithStrikethrough(idsToStrike) {
            return `${formatSideWithStrikethrough(state.lhs, idsToStrike)} <span class="mx-3 text-indigo-500">=</span> ${formatSideWithStrikethrough(state.rhs, idsToStrike)}`;
        }

        // --- Actions & Operations ---
        function selectTerm(id) {
            const index = state.selectedTermIds.indexOf(id);
            if (index > -1) state.selectedTermIds.splice(index, 1);
            else state.selectedTermIds.push(id);
            updateUI();
        }

        function executeMove() {
            if (state.selectedTermIds.length === 0) return;
            
            [...state.selectedTermIds].forEach(id => {
                let fromSide = 'lhs', toSide = 'rhs';
                let termIndex = state.lhs.findIndex(t => t.id === id);
                
                if (termIndex === -1) {
                    termIndex = state.rhs.findIndex(t => t.id === id);
                    fromSide = 'rhs'; toSide = 'lhs';
                }
                if (termIndex === -1) return;

                let term = state[fromSide][termIndex];
                state[fromSide].splice(termIndex, 1);
                
                if (term.type === 'normal') {
                    term.coeff = Frac.create(-term.coeff.n, term.coeff.d);
                } else {
                    term.factor = Frac.create(-term.factor.n, term.factor.d);
                }
                
                state[toSide].push(term);
            });

            addHistoryRecord(`Moved term(s) across '=' and inverted sign.`);
            state.selectedTermIds = [];
            updateUI();
        }

        function executeExpand() {
            if (state.selectedTermIds.length === 0) {
                return showModal("Action Required", "Please select a bracketed term to expand by tapping it first.");
            }

            let hasUnexpandable = false;
            let expandedCount = 0;

            let expandSide = (side) => {
                let newSide = [];
                side.forEach(t => {
                    if (state.selectedTermIds.includes(t.id)) {
                        if (t.type === 'group') {
                            if (t.bottomTerms) {
                                hasUnexpandable = true;
                                newSide.push(t); // Do not expand if variable denominator
                            } else {
                                expandedCount++;
                                t.innerTerms.forEach(it => {
                                    let newCoeff = Frac.mul(it.coeff, t.factor);
                                    newSide.push({ id: generateId(), type: 'normal', coeff: newCoeff, var: it.var });
                                });
                            }
                        } else {
                            newSide.push(t); // Selected but not a group, keep as is
                        }
                    } else {
                        newSide.push(t); // Not selected, keep as is
                    }
                });
                return newSide;
            };
            
            let lhsRes = expandSide(state.lhs);
            let rhsRes = expandSide(state.rhs);
            
            if (hasUnexpandable) {
                return showModal("Action Required", "You cannot expand a fraction with a variable denominator directly. Multiply both sides by the denominator first.");
            }

            if (expandedCount > 0) {
                let intermediateHTML = formatEquationWithStrikethrough(state.selectedTermIds);
                state.lhs = lhsRes;
                state.rhs = rhsRes;
                addHistoryRecord("Expanded selected bracket(s).", intermediateHTML);
                state.selectedTermIds = [];
                updateUI();
            } else {
                showModal("Invalid Selection", "None of the selected terms are brackets that can be expanded.");
            }
        }

        function executeCombine() {
            if (state.selectedTermIds.length < 2) {
                return showModal("Action Required", "Please select at least two terms to combine by tapping them.");
            }

            let selectedLHS = state.lhs.filter(t => state.selectedTermIds.includes(t.id));
            let selectedRHS = state.rhs.filter(t => state.selectedTermIds.includes(t.id));

            if (selectedLHS.length > 0 && selectedRHS.length > 0) {
                return showModal("Different Sides", "Cannot combine terms across the '=' sign. Move them to the same side first.");
            }

            let activeSide = selectedLHS.length > 0 ? 'lhs' : 'rhs';
            let selectedTerms = selectedLHS.length > 0 ? selectedLHS : selectedRHS;

            let firstTerm = selectedTerms[0];
            if (firstTerm.type === 'group' || selectedTerms.some(t => t.type === 'group')) {
                return showModal("Expand First", "Please expand grouped brackets before combining.");
            }

            let targetVar = firstTerm.var;
            let allLike = selectedTerms.every(t => t.type === 'normal' && t.var === targetVar);
            if (!allLike) {
                return showModal("Unlike Terms", "Please select like terms (they must have the exact same variable).");
            }

            let intermediateHTML = formatEquationWithStrikethrough(state.selectedTermIds);

            let sumCoeff = Frac.create(0);
            selectedTerms.forEach(t => sumCoeff = Frac.add(sumCoeff, t.coeff));

            state[activeSide] = state[activeSide].filter(t => !state.selectedTermIds.includes(t.id));

            if (sumCoeff.n !== 0) {
                state[activeSide].push({ id: generateId(), type: 'normal', coeff: sumCoeff, var: targetVar });
            } else if (state[activeSide].length === 0) {
                state[activeSide].push({ id: generateId(), type: 'normal', coeff: Frac.create(0), var: null });
            }

            addHistoryRecord("Combined like terms.", intermediateHTML);
            state.selectedTermIds = [];
            updateUI();
        }

        function executeOperation() {
            let op = ui.opSelect.value;
            let valStr = ui.opVal.value.trim();
            let valFrac = Frac.parse(valStr);
            
            // Handle multiplying by variable expressions (e.g. x+2) to cancel denominators
            if (!valFrac && op === '*') {
                let exprStr = valStr.replace(/\s+/g, '').replace(/^\(|\)$/g, '');
                let exprTerms = splitTerms(exprStr).map(t => parseNormalTerm(t)).filter(t => t !== null);
                
                if (exprTerms.length > 0) {
                    let canApply = true;
                    
                    let applyExpr = (side) => {
                        for (let i = 0; i < side.length; i++) {
                            let t = side[i];
                            if (t.type === 'group' && t.bottomTerms) {
                                if (compareTerms(t.bottomTerms, exprTerms)) {
                                    t.bottomTerms = null; // Denominator canceled!
                                } else {
                                    canApply = false;
                                }
                            } else if (t.type === 'normal') {
                                let newInner = exprTerms.map(et => ({ id: generateId(), type: 'normal', coeff: et.coeff, var: et.var }));
                                side[i] = { id: t.id, type: 'group', factor: t.coeff, innerTerms: newInner, bottomTerms: null };
                            } else if (t.type === 'group' && !t.bottomTerms) {
                                canApply = false; // Expanding nested groups is too complex for this basic step
                            }
                        }
                    };
                    
                    let lhsCopy = JSON.parse(JSON.stringify(state.lhs));
                    let rhsCopy = JSON.parse(JSON.stringify(state.rhs));
                    
                    applyExpr(lhsCopy);
                    applyExpr(rhsCopy);
                    
                    if (!canApply) {
                        return showModal("Invalid Operation", "Can only multiply by an expression if it cancels a denominator or multiplies a normal term. Expand all groups first.");
                    }
                    
                    let opStr = `<span class="text-emerald-600 font-bold ml-2"> × (${exprStr})</span>`;
                    let lhsWrap = (lhsCopy.length > 1) ? `(${formatSide(state.lhs)})` : formatSide(state.lhs);
                    let rhsWrap = (rhsCopy.length > 1) ? `(${formatSide(state.rhs)})` : formatSide(state.rhs);
                    
                    let intermediateHTML = `${lhsWrap}${opStr} <span class="mx-3 text-indigo-500">=</span> ${rhsWrap}${opStr}`;
                    
                    state.lhs = lhsCopy;
                    state.rhs = rhsCopy;
                    
                    addHistoryRecord(`Multiplied both sides by (${exprStr}).`, intermediateHTML);
                    updateUI();
                    return;
                }
            }

            if (!valFrac) return showModal("Action Required", "Please enter a valid number, fraction, or expression (e.g. x+2).");
            if (valFrac.n === 0 && (op === '*' || op === '/')) return showModal("Math Error", "Cannot multiply or divide by zero.");

            let opChar = op === '*' ? '×' : (op === '/' ? '÷' : (op === '+' ? '+' : '−'));
            let opColor = 'text-emerald-600'; 
            let opStr = `<span class="${opColor} font-bold ml-2"> ${opChar} ${Frac.toHTML(valFrac)}</span>`;
            
            let lhsWrap = (op === '*' || op === '/') && state.lhs.length > 1 ? `(${formatSide(state.lhs)})` : formatSide(state.lhs);
            let rhsWrap = (op === '*' || op === '/') && state.rhs.length > 1 ? `(${formatSide(state.rhs)})` : formatSide(state.rhs);
            
            let intermediateHTML = `${lhsWrap}${opStr} <span class="mx-3 text-indigo-500">=</span> ${rhsWrap}${opStr}`;

            if (op === '+' || op === '-') {
                let coeffToApply = op === '+' ? valFrac : Frac.create(-valFrac.n, valFrac.d);
                state.lhs.push({ id: generateId(), type: 'normal', coeff: coeffToApply, var: null });
                state.rhs.push({ id: generateId(), type: 'normal', coeff: coeffToApply, var: null });
                addHistoryRecord(`${op === '+' ? 'Added' : 'Subtracted'} ${Frac.toHTML(valFrac)} to both sides.`, intermediateHTML);
            } 
            else if (op === '*' || op === '/') {
                let applyMath = (side) => {
                    side.forEach(t => {
                        if (t.type === 'normal') {
                            t.coeff = op === '*' ? Frac.mul(t.coeff, valFrac) : Frac.div(t.coeff, valFrac);
                        } else if (t.type === 'group') {
                            t.factor = op === '*' ? Frac.mul(t.factor, valFrac) : Frac.div(t.factor, valFrac);
                        }
                    });
                };
                applyMath(state.lhs);
                applyMath(state.rhs);
                addHistoryRecord(`${op === '*' ? 'Multiplied' : 'Divided'} both sides by ${Frac.toHTML(valFrac)}.`, intermediateHTML);
            }
            updateUI();
        }

        function resetEquation() {
            state.lhs = JSON.parse(JSON.stringify(state.originalLhs));
            state.rhs = JSON.parse(JSON.stringify(state.originalRhs));
            state.history = [];
            state.stepCounter = 0;
            state.selectedTermIds = [];
            addHistoryRecord("Original Equation");
            updateUI();
        }

        // --- History & State Tracking ---
        function addHistoryRecord(actionDescription, intermediateHTML = null) {
            state.history.push({
                stepNum: state.stepCounter++,
                action: actionDescription,
                eqStr: formatEquation(),
                intermediateHTML: intermediateHTML,
                lhsSnapshot: JSON.parse(JSON.stringify(state.lhs)),
                rhsSnapshot: JSON.parse(JSON.stringify(state.rhs))
            });
        }

        function executeUndo() {
            if (state.history.length <= 1) return;
            
            state.history.pop();
            state.stepCounter--;
            
            let previousState = state.history[state.history.length - 1];
            state.lhs = JSON.parse(JSON.stringify(previousState.lhsSnapshot));
            state.rhs = JSON.parse(JSON.stringify(previousState.rhsSnapshot));
            state.selectedTermIds = [];
            
            updateUI();
        }

        function checkSolved() {
            let isSolved = false;
            let checkSides = (s1, s2) => {
                if (s1.length === 1 && s2.length === 1) {
                    if (s1[0].type === 'normal' && s1[0].var && s1[0].coeff.n === 1 && s1[0].coeff.d === 1 && !s2[0].var && s2[0].type === 'normal') isSolved = true;
                }
            };
            checkSides(state.lhs, state.rhs);
            checkSides(state.rhs, state.lhs);

            if (isSolved) ui.successBanner.classList.remove('hidden');
            else ui.successBanner.classList.add('hidden');
        }

        // --- Rendering Engine ---
        function updateUI() {
            let renderSide = (sideArray) => {
                return sideArray.map(t => {
                    let isSelected = state.selectedTermIds.includes(t.id);
                    let valHTML = "";
                    let signStr = "";

                    if (t.type === 'normal') {
                        let isNeg = t.coeff.n < 0;
                        signStr = isNeg ? '−' : '+';
                        let absF = Frac.abs(t.coeff);
                        let showCoeff = !(absF.n === 1 && absF.d === 1 && t.var);
                        
                        if (showCoeff) {
                            if (absF.d === 1) valHTML += absF.n;
                            else valHTML += `<div class="inline-flex flex-col items-center justify-center align-middle mx-1 text-[0.7em] sm:text-[0.8em] leading-none"><span class="border-b-[1.5px] border-current px-1 pb-[2px]">${absF.n}</span><span class="pt-[2px]">${absF.d}</span></div>`;
                        }
                        if (t.var) valHTML += t.var;
                        if (absF.n === 0 && !t.var) { signStr = ""; valHTML = "0"; }
                    } 
                    else if (t.type === 'group') {
                        let isNeg = t.factor.n < 0;
                        signStr = isNeg ? '−' : '+';
                        let absF = Frac.abs(t.factor);
                        let innerFormatted = t.innerTerms.map((it, i) => formatTermPlain(it, i===0)).join('');
                        
                        if (t.bottomTerms) {
                            let bottomFormatted = t.bottomTerms.map((it, i) => formatTermPlain(it, i===0)).join('');
                            let multStr = absF.n !== 1 ? absF.n : '';
                            valHTML = `<div class="inline-flex flex-col items-center justify-center align-middle mx-1 text-sm sm:text-base leading-tight">
                                            <span class="border-b-[1.5px] border-slate-300 px-2 sm:px-3 pb-1">${multStr}(${innerFormatted})</span>
                                            <span class="pt-1 text-slate-500">(${bottomFormatted})</span>
                                        </div>`;
                        } else if (absF.d === 1) {
                            let multStr = absF.n !== 1 ? absF.n : '';
                            valHTML = `<span class="flex items-center">${multStr}(${innerFormatted})</span>`;
                        } else {
                            let multStr = absF.n !== 1 ? absF.n : '';
                            valHTML = `<div class="inline-flex flex-col items-center justify-center align-middle mx-1 text-sm sm:text-base leading-tight">
                                            <span class="border-b-[1.5px] border-slate-300 px-2 sm:px-3 pb-1">${multStr}(${innerFormatted})</span>
                                            <span class="pt-1 text-slate-500">${absF.d}</span>
                                        </div>`;
                        }
                    }

                    return `
                        <button onclick="selectTerm('${t.id}')" 
                                class="flex items-center bg-white border-2 border-slate-200 rounded-xl overflow-hidden transition-all duration-200 hover:border-indigo-400 hover:shadow-md shadow-sm shrink-0 ${isSelected ? 'term-selected' : ''}">
                            ${signStr ? `<div class="px-2 sm:px-3 py-1.5 sm:py-2 bg-slate-50 text-slate-500 font-bold text-base sm:text-lg border-r border-slate-200">${signStr}</div>` : ''}
                            <div class="px-2 sm:px-4 py-1.5 sm:py-2 text-slate-800 font-mono font-bold text-base sm:text-xl flex items-center">${valHTML}</div>
                        </button>
                    `;
                }).join('');
            };

            ui.lhsZone.innerHTML = state.lhs.length === 0 ? `<span class="text-slate-400 font-mono text-xl">0</span>` : renderSide(state.lhs);
            ui.rhsZone.innerHTML = state.rhs.length === 0 ? `<span class="text-slate-400 font-mono text-xl">0</span>` : renderSide(state.rhs);

            ui.btnMove.disabled = state.selectedTermIds.length === 0;
            ui.btnUndo.disabled = state.history.length <= 1;

            ui.historyContainer.innerHTML = state.history.map((record, index) => {
                let isLast = index === state.history.length - 1;
                
                let intermediateRender = record.intermediateHTML ? `
                    <div class="mb-2 sm:mb-3 text-slate-500 font-mono text-sm sm:text-base opacity-80 pl-1 sm:pl-2 whitespace-nowrap overflow-x-auto no-scrollbar">
                        ${record.intermediateHTML}
                    </div>
                    <div class="flex justify-start pl-6 sm:pl-8 mb-2">
                        <svg class="h-3 w-3 sm:h-4 sm:w-4 text-slate-300 transform -rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    </div>
                ` : '';

                return `
                    <div class="flex gap-3 sm:gap-4 relative">
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white border-2 ${isLast ? 'border-indigo-400 text-indigo-500' : 'border-slate-300 text-slate-500'} flex items-center justify-center font-bold text-xs sm:text-sm shrink-0 z-10 shadow-sm">
                            ${record.stepNum}
                        </div>
                        <div class="pt-1 pb-4 flex-1 min-w-0">
                            ${record.stepNum > 0 ? `<p class="text-xs sm:text-sm font-medium text-amber-600 mb-2 flex items-center gap-1 sm:gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 sm:h-4 sm:w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg> <span class="truncate">${record.action}</span></p>` : ''}
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 sm:p-4 inline-flex flex-col shadow-sm max-w-full overflow-hidden">
                                ${intermediateRender}
                                <div class="font-mono text-base sm:text-lg font-bold whitespace-nowrap overflow-x-auto no-scrollbar ${isLast ? 'text-slate-800' : 'text-slate-600'} tracking-wide">
                                    ${record.eqStr}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            setTimeout(() => {
                const historyDiv = document.getElementById('history-scroll-container');
                if (historyDiv) historyDiv.scrollTop = historyDiv.scrollHeight;
            }, 50);

            checkSolved();
        }

        // Add Enter key support for the new visual builder inputs
        ['lhs-top', 'lhs-bottom', 'rhs-top', 'rhs-bottom'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') parseAndStart();
            });
        });
    </script>
</body>
</html>
